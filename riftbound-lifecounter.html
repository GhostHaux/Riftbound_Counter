<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Riftbound Lifecounter</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- iOS specific meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Riftbound">

    <!-- Theme colors -->
    <meta name="theme-color" content="#ffd700">
    <meta name="msapplication-TileColor" content="#1a1a2e">

    <!-- App icons for iOS -->
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 20px;
            text-align: center;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #ffd700;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.5);
        }

        .controls {
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
        }

        .controls button {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .controls button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .controls button:active {
            transform: translateY(0);
        }

        .game-area {
            flex: 1;
            display: flex;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
        }

        .player-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .player-zone.player1 {
            border-color: rgba(59, 130, 246, 0.5);
        }

        .player-zone.player2 {
            border-color: rgba(239, 68, 68, 0.5);
        }

        .player-label {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .player1 .player-label {
            color: #3b82f6;
        }

        .player2 .player-label {
            color: #ef4444;
        }

        .points-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .points-display {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 120px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s;
        }

        .points-display:active {
            transform: scale(0.98);
        }

        .player1 .points-display {
            color: #3b82f6;
            text-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
        }

        .player2 .points-display {
            color: #ef4444;
            text-shadow: 0 0 30px rgba(239, 68, 68, 0.5);
        }

        .points-controls {
            display: flex;
            height: 60px;
        }

        .points-controls button {
            flex: 1;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 32px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .points-controls button:first-child {
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .points-controls button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .points-controls button:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.95);
        }

        .battlefields {
            display: flex;
            gap: 10px;
        }

        .battlefield {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 12px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .battlefield-label {
            font-size: 11px;
            text-align: center;
            color: #ffd700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .battlefield-display {
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            color: #ffd700;
            cursor: pointer;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.2s;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .battlefield-display:active {
            transform: scale(0.95);
            background: rgba(255, 215, 0, 0.1);
        }

        .battlefield-controls {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }

        .battlefield-controls button {
            flex: 1;
            padding: 8px;
            border: none;
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
        }

        .battlefield-controls button:hover {
            background: rgba(255, 215, 0, 0.2);
        }

        .battlefield-controls button:active {
            transform: scale(0.95);
        }

        /* Mobile portrait optimization */
        @media (max-width: 768px) and (orientation: portrait) {
            .header {
                padding: 8px 15px;
            }

            .header h1 {
                font-size: 18px;
            }

            .controls {
                padding: 6px 10px;
                gap: 6px;
            }

            .controls button {
                padding: 6px 10px;
                font-size: 11px;
            }

            .game-area {
                flex-direction: column;
                padding: 10px;
                gap: 10px;
            }

            .player-zone {
                padding: 12px;
                gap: 10px;
            }

            .player-label {
                font-size: 14px;
            }

            .points-display {
                font-size: 72px;
            }

            .points-controls {
                height: 50px;
            }

            .points-controls button {
                font-size: 28px;
            }

            .battlefield {
                padding: 8px;
            }

            .battlefield-label {
                font-size: 9px;
                margin-bottom: 4px;
            }

            .battlefield-display {
                font-size: 32px;
                padding: 6px;
            }

            .battlefield-controls button {
                padding: 6px;
                font-size: 16px;
            }
        }

        /* Tablet and larger screens in portrait */
        @media (min-width: 769px) and (max-width: 1024px) and (orientation: portrait) {
            .game-area {
                flex-direction: column;
            }

            .points-display {
                font-size: 100px;
            }

            .battlefield-display {
                font-size: 42px;
            }
        }

        /* Mobile landscape */
        @media (max-width: 768px) and (orientation: landscape) {
            .header h1 {
                font-size: 16px;
            }

            .header {
                padding: 6px 15px;
            }

            .controls {
                padding: 5px 10px;
                gap: 6px;
            }

            .controls button {
                padding: 5px 10px;
                font-size: 11px;
            }

            .game-area {
                padding: 10px;
                gap: 10px;
            }

            .player-zone {
                padding: 10px;
                gap: 8px;
            }

            .player-label {
                font-size: 14px;
            }

            .points-display {
                font-size: 60px;
            }

            .points-controls {
                height: 45px;
            }

            .points-controls button {
                font-size: 24px;
            }

            .battlefield-display {
                font-size: 28px;
                padding: 5px;
            }

            .battlefield-label {
                font-size: 9px;
                margin-bottom: 3px;
            }

            .battlefield-controls button {
                padding: 5px;
                font-size: 14px;
            }
        }

        /* Larger landscape devices */
        @media (min-width: 769px) and (orientation: landscape) and (max-width: 1024px) {
            .header h1 {
                font-size: 20px;
            }

            .controls {
                padding: 8px 15px;
            }

            .game-area {
                padding: 15px;
                gap: 15px;
            }

            .player-zone {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>RIFTBOUND LIFECOUNTER</h1>
    </div>

    <div class="controls">
        <button onclick="resetAll()">Reset All</button>
        <button onclick="resetPoints()">Reset Points</button>
        <button onclick="resetBattlefields()">Reset Battlefields</button>
    </div>

    <div class="game-area">
        <div class="player-zone player1">
            <div class="player-label">PLAYER 1</div>

            <div class="points-container">
                <div class="points-display" onclick="incrementPoints(1, 1)" id="player1-points">0</div>
                <div class="points-controls">
                    <button onclick="incrementPoints(1, -1)">-</button>
                    <button onclick="incrementPoints(1, 1)">+</button>
                </div>
            </div>

            <div class="battlefields">
                <div class="battlefield">
                    <div class="battlefield-label">Battlefield 1</div>
                    <div class="battlefield-display" onclick="incrementBattlefield(1, 1, 1)" id="player1-battlefield1">0</div>
                    <div class="battlefield-controls">
                        <button onclick="incrementBattlefield(1, 1, -1)">-</button>
                        <button onclick="incrementBattlefield(1, 1, 1)">+</button>
                    </div>
                </div>

                <div class="battlefield">
                    <div class="battlefield-label">Battlefield 2</div>
                    <div class="battlefield-display" onclick="incrementBattlefield(1, 2, 1)" id="player1-battlefield2">0</div>
                    <div class="battlefield-controls">
                        <button onclick="incrementBattlefield(1, 2, -1)">-</button>
                        <button onclick="incrementBattlefield(1, 2, 1)">+</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="player-zone player2">
            <div class="player-label">PLAYER 2</div>

            <div class="points-container">
                <div class="points-display" onclick="incrementPoints(2, 1)" id="player2-points">0</div>
                <div class="points-controls">
                    <button onclick="incrementPoints(2, -1)">-</button>
                    <button onclick="incrementPoints(2, 1)">+</button>
                </div>
            </div>

            <div class="battlefields">
                <div class="battlefield">
                    <div class="battlefield-label">Battlefield 1</div>
                    <div class="battlefield-display" onclick="incrementBattlefield(2, 1, 1)" id="player2-battlefield1">0</div>
                    <div class="battlefield-controls">
                        <button onclick="incrementBattlefield(2, 1, -1)">-</button>
                        <button onclick="incrementBattlefield(2, 1, 1)">+</button>
                    </div>
                </div>

                <div class="battlefield">
                    <div class="battlefield-label">Battlefield 2</div>
                    <div class="battlefield-display" onclick="incrementBattlefield(2, 2, 1)" id="player2-battlefield2">0</div>
                    <div class="battlefield-controls">
                        <button onclick="incrementBattlefield(2, 2, -1)">-</button>
                        <button onclick="incrementBattlefield(2, 2, 1)">+</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Game state
        const state = {
            player1: { points: 0, battlefield1: 0, battlefield2: 0 },
            player2: { points: 0, battlefield1: 0, battlefield2: 0 }
        };

        // Prevent accidental page refresh
        window.addEventListener('beforeunload', (e) => {
            if (state.player1.points > 0 || state.player2.points > 0 ||
                state.player1.battlefield1 > 0 || state.player1.battlefield2 > 0 ||
                state.player2.battlefield1 > 0 || state.player2.battlefield2 > 0) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        function incrementPoints(player, delta) {
            const playerKey = `player${player}`;
            state[playerKey].points = Math.max(0, state[playerKey].points + delta);
            document.getElementById(`${playerKey}-points`).textContent = state[playerKey].points;

            // Visual feedback
            const element = document.getElementById(`${playerKey}-points`);
            element.style.transform = 'scale(1.1)';
            setTimeout(() => {
                element.style.transform = 'scale(1)';
            }, 150);
        }

        function incrementBattlefield(player, battlefield, delta) {
            const playerKey = `player${player}`;
            const battlefieldKey = `battlefield${battlefield}`;
            state[playerKey][battlefieldKey] = Math.max(0, state[playerKey][battlefieldKey] + delta);
            document.getElementById(`${playerKey}-${battlefieldKey}`).textContent = state[playerKey][battlefieldKey];

            // Visual feedback
            const element = document.getElementById(`${playerKey}-${battlefieldKey}`);
            element.style.transform = 'scale(1.1)';
            setTimeout(() => {
                element.style.transform = 'scale(1)';
            }, 150);
        }

        function resetPoints() {
            if (confirm('Reset all points to 0?')) {
                state.player1.points = 0;
                state.player2.points = 0;
                document.getElementById('player1-points').textContent = 0;
                document.getElementById('player2-points').textContent = 0;
            }
        }

        function resetBattlefields() {
            if (confirm('Reset all battlefield counters to 0?')) {
                state.player1.battlefield1 = 0;
                state.player1.battlefield2 = 0;
                state.player2.battlefield1 = 0;
                state.player2.battlefield2 = 0;
                document.getElementById('player1-battlefield1').textContent = 0;
                document.getElementById('player1-battlefield2').textContent = 0;
                document.getElementById('player2-battlefield1').textContent = 0;
                document.getElementById('player2-battlefield2').textContent = 0;
            }
        }

        function resetAll() {
            if (confirm('Reset everything to 0?')) {
                resetPoints();
                resetBattlefields();
            }
        }

        // Prevent double-tap zoom on iOS
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (event) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
